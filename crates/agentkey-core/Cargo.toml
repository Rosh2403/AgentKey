[package]
name = "agentkey-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agentkey protocol core: Ed25519 verify, canonical encoding, typed verify outcomes (Rust parallel of packages/protocol + packages/crypto)"
readme = "README.md"
keywords = ["agentkey", "ed25519", "identity"]
categories = ["cryptography", "authentication"]

[lib]
name = "agentkey_core"
path = "src/lib.rs"

[[bin]]
name = "agentkey-verify"
path = "src/bin/agentkey-verify.rs"
required-features = ["cli"]

[features]
default = []
# Thin CLI binary for offline verify (optional).
cli = []

[dependencies]
ed25519-dalek = { version = "2.1", features = ["std"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["std"] }
hex = "0.4"
